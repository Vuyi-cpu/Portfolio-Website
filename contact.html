<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Vuyisa Msipa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./CSS/main.css">
<link rel="stylesheet" href="./CSS/layout.css">
<link rel="stylesheet" href="./CSS/components.css">
<link rel="stylesheet" href="./CSS/nav_and_foot.css">
<link rel="stylesheet" href="./CSS/responsive.css">

<script src="./JS/loading.js" defer></script>
<script src="./JS/main.js" defer></script>
<script src="./JS/navigation.js" defer></script>
<script src="./JS/scroll-animation.js" defer></script>
<script src="./JS/modal.js" defer></script>
<script src="./JS/form-validation.js" defer></script>
<script src="./JS/sections.js" defer></script>
<script src="./JS/particles.js" defer></script>
</head>
<body>
  <canvas id="particle-canvas"></canvas>
<div id="loader">
  <div class="ring-wrapper">
    <div class="ring"></div>
    <span class="loading-text">loading...</span>
  </div>
  
  <h1 class="website-name">Contacts</h1>
</div>
 
 <nav id="nav"></nav>
  
  <div class="mob-menu" id="mm"></div>
 

<div class="page-header reveal" style="text-align: center; display: flex; flex-direction: column; align-items: center; padding-bottom: 2rem;">
  <h1 class="page-title">Contact <span>Me</span></h1>
  <p class="page-intro" style="text-align: center; margin: 0 auto;">Have a project in mind or just want to connect? Feel free to reach out.</p>
</div>
 
<section class="contact-sec">
  <!-- Centered form container overriding the previous grid layout -->
  <div class="form-side reveal" style="max-width: 650px; margin: 0 auto;">
    <div class="form-card">
      <div id="contact-form">
        
        <!-- Stacked fields without external labels to match UI screenshot -->
        <div class="field">
          <input type="text" id="name" placeholder="Your Name">
          <div class="err" id="name-err">Please enter your name</div>
        </div>
        
        <div class="field">
          <input type="email" id="email" placeholder="Your Email">
          <div class="err" id="email-err">Please enter a valid email</div>
        </div>
        
        <div class="field">
          <textarea id="message" placeholder="Your Message"></textarea>
          <div class="err" id="msg-err">Please enter a message</div>
        </div>
        
        <button class="btn-submit" id="submit-btn" onclick="submitForm()">Send Message</button>
      </div>
      
      <div class="form-success" id="form-success">
        ✓ Message sent successfully!<br>
        <span style="color:var(--muted);font-size:.82rem">I'll be in touch within 1–2 business days.</span>
      </div>
    </div>
  </div>
</section>
 
<footer></footer>

</body>
</html>
