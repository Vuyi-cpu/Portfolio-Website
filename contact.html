<!DOCTYPE html>
<html lang="en">
<head>
  <!-- META -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | Vuyisa</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./CSS/main.css">
  <link rel="stylesheet" href="./CSS/layout.css">
  <link rel="stylesheet" href="./CSS/components.css">
  <link rel="stylesheet" href="./CSS/responsive.css">
    <link rel="stylesheet" href="./CSS/nav_and_foot.css">

  <!-- JS -->
 <script src="./JS/navigation.js" defer></script>
  <script src="./JS/scroll-animation.js" defer></script>
  <script src="./JS/modal.js" defer></script>
  <script src="./JS/loading.js" defer></script>
  <script src="./JS/form-validation.js" defer></script>
  <script src="./JS/main.js" defer></script>
</head>

<body>

  <!-- NAVBAR -->
  <div id="navbar-container"></div>

  <main>

    <!-- ===============================
         CONTACT INTRO
    ================================ -->
    <section class="contact">
      <h1>Contact Me</h1>

      <p style="max-width:600px; margin:20px auto; text-align:center;">
        Have a project in mind or just want to connect? Feel free to reach out.
      </p>
    </section>

    <!-- ===============================
         CONTACT FORM
    ================================ -->
    <section class="contact-container">

      <form class="contact-form">

        <input type="text" placeholder="Your Name" required>

        <input type="email" placeholder="Your Email" required>

        <textarea placeholder="Your Message" rows="5" required></textarea>

        <button type="submit" class="view-project-btn">Send Message</button>

      </form>

    </section>

  </main>

  <!-- FOOTER -->
  <div id="footer-container"></div>

</body>
</html>
